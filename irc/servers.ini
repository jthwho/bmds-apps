# IRC's list of networks (devplan/irc.md §7c), read only when asked: Network > Networks... >
# Add from list. A section a network, in networks.ini's own keys:
#
#   host       the network's round-robin name (not one server)
#   port, tls  TLS where the network offers it (the port it publishes)
#   login      what it offers for a registered nick: sasl, nickserv, or none (no nick
#              services, or its own: QuakeNet's Q, Undernet's X, AfterNET's AuthServ)
#   about      a line: who it's for
#   offer      yes: one of the networks a first start offers
#
# Each checked against the network's own pages on 2026-11-17 (its connect, servers or FAQ
# page). Updated with the package; a user's networks.ini is never changed by it.

[Libera.Chat]
host = irc.libera.chat
port = 6697
tls = yes
login = sasl
about = Free and open-source software projects
offer = yes

